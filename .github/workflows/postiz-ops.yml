name: postiz-ops

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-and-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml (no containers started)
        run: ops/postiz/validate.sh
      - name: Shellcheck
        run: shellcheck ops/postiz/*.sh

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
