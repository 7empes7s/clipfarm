name: postiz-ops

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-and-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml (no containers started)
        run: ops/postiz/validate.sh
      - name: Shellcheck
        run: shellcheck ops/postiz/*.sh

  # typecheck and test now run for the whole repo (ops included) in CI's "check" job,
  # which also installs ffmpeg for the pipeline tests. A second "npm test" here would
  # duplicate that run and fail without ffmpeg, so it was removed rather than duplicated.
